# Posts a CLA request on PRs labeled `cla-needed`, then a reminder every 3 days
# until the label is removed or swapped for `cla-received`.
# The logic lives in FasterXML/jackson: .github/workflows/cla-nudge.yml
name: CLA nudge

on:
  workflow_dispatch:
    inputs:
      dry-run:
        description: 'Only log what would be posted'
        type: boolean
        default: true
      simulate-now:
        description: 'Testing only: ISO timestamp to treat as now, e.g. 2026-12-01T00:00:00Z'
        type: string
        default: ''
      cutoff:
        description: 'Test cutoff date'
        type: string
        default: '2026-11-07'

permissions: {}

jobs:
  cla-nudge:
    permissions:
      issues: write
      pull-requests: write
    uses: FasterXML/jackson/.github/workflows/cla-nudge.yml@ca1ef0c432f8b88313f5684a97a87371001f07fa
    with:
      dry-run: ${{ inputs.dry-run == true }}
      simulate-now: ${{ inputs.simulate-now || '' }}
      interval-days: 3
      skip-labeled-before: ${{ inputs.cutoff }}
